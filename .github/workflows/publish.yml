name: publish
on:
  workflow_dispatch:
    inputs:
      version:
        description: "vigi version to package, or 'latest'."
        default: "latest"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and verify both binaries
        id: fetch
        run: |
          set -euo pipefail
          ver="${{ github.event.inputs.version }}"
          sub="latest"
          [ "$ver" != "latest" ] && sub="v${ver#v}"
          curl -fsSL "https://vigihq.com/dl/$sub/manifest.json" -o manifest.json
          for arch in amd64 arm64; do
            curl -fsSL "https://vigihq.com/dl/$sub/vigi-linux-$arch" -o "vigi-$arch"
            real="$(python3 verify.py "vigi-$arch" manifest.json "vigi-linux-$arch")"
            echo "verified vigi-linux-$arch at $real"
            echo "version=$real" >> "$GITHUB_OUTPUT"
          done

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/fathermarz/vigi:latest
            ghcr.io/fathermarz/vigi:${{ steps.fetch.outputs.version }}
